# ── Zigbee Role Configuration ────────────────────────────────
# Makefile toggles between END_DEVICE (sleepy) and ROUTER (always-on)
# - debug/prod modes: END_DEVICE with sleepy behavior
# - hub mode: ROUTER (repeater, always powered, no sleep)
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y
# CONFIG_ZIGBEE_ROLE_ROUTER=y
# Scan all Zigbee channels so we find the coordinator regardless of
# which channel ZHA is configured on (11-26).
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y
CONFIG_ZIGBEE_CHANNEL_MASK=0x07FFF800
# Sleepy behavior (rx-off-when-idle) configured via API for end devices:
#   zigbee_configure_sleepy_behavior(true)  — called before zigbee_enable()
# Long poll interval configured via API after join:
#   zb_zdo_pim_set_long_poll_interval(POLL_INTERVAL_MS)

# Zigbee application utilities (needed for zigbee_configure_sleepy_behavior)
CONFIG_ZIGBEE_APP_UTILS=y
# ZIGBEE_FACTORY_RESET (default y) implies DK_LIBRARY, which tries to init
# Nordic DK LEDs/buttons via GPIO nodes that don't exist on nice!nano → panic.
# Override the imply with an explicit n.
CONFIG_DK_LIBRARY=n
# ZIGBEE_HAVE_SERIAL must stay y — the prebuilt libzboss.a has an unconditional
# hard reference to zb_osif_serial_init which lives in the serial shim.

# ── Logging (USB CDC configured by board defconfig) ──────────
# USB and logging are toggled by Makefile based on DEBUG mode:
#   DEBUG=y  → USB/LOG =y (development, ~3mA on USB)
#   DEBUG=n  → USB/LOG =n (battery production, <1mA)
# Makefile uses sed to toggle between =y and =n to override board defconfig.
CONFIG_USB_DEVICE_STACK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Use deferred mode to prevent blocking when USB suspends during sleep
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_USB_CDC_ACM_LOG_LEVEL_INF=y
# Disable runtime PM for USB to prevent suspend during sleep
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_DEVICE_BOS=n
# Enable Zigbee logging to see join status
CONFIG_ZIGBEE_LOGGER_EP_LOG_LEVEL_INF=y
CONFIG_ZIGBEE_APP_UTILS_LOG_LEVEL_INF=y
# ZBOSS trace logging off (saves flash/RAM); ZBOSS assert → reset
CONFIG_ZBOSS_TRACE_LOG_LEVEL_OFF=y
CONFIG_ZBOSS_RESET_ON_ASSERT=y

# ── Crypto — Zigbee AES via nRF52840 hardware ECB peripheral ─
# ECB is a simple register-mapped peripheral — no CC310, no Oberon.
# (DK_LIBRARY=n below removes the DK init crash that originally
#  made us think ECB was the problem.)
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_CRYPTO_INIT_PRIORITY=80

# ── I2C + SHT40 sensor driver ────────────────────────────────
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SHT4X=y

# ── ADC — VDD battery voltage via SAADC ──────────────────────
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# ── GPIO — VCC / GND power gate for sensor ───────────────────
CONFIG_GPIO=y

# ── Flash / NVS / Settings — Zigbee NVRAM persistence ────────
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# ── Networking — disable IPv6/UDP (Zigbee doesn't use them) ──────────
# CONFIG_ZIGBEE selects NETWORKING, which enables IPv6 by default.
# IPv6 Neighbor Discovery / DAD cooperative threads try to transmit
# over the radio immediately on interface-up, crashing before ZBOSS
# is ready.  The official nRF Connect SDK Zigbee samples all set these.
CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_UDP=n

# ── 802.15.4 temperature update — disable to avoid assert panic ──
# temperature_update_init (POST_KERNEL 91) calls __ASSERT_NO_MSG(device_is_ready(temp)).
# The nRF5 die temp sensor (temp_nrf5_mpsl_init, priority 90) returns an error,
# leaving the device not-ready, which triggers the assert and panics.
# Disabling this uses a fixed 20°C for radio crystal calibration — fine for a
# Zigbee sensor node that doesn't need perfect RF temperature compensation.
CONFIG_NRF_802154_TEMPERATURE_UPDATE=n

# ── Init priority ordering ────────────────────────────────────────────
#
# Root cause: CONFIG_NET_INIT_PRIO is not user-settable (derives from
# APPLICATION_INIT_PRIORITY=90).  net_core_init at priority 90 creates
# Zephyr network management threads that try to bring up the ieee802154
# interface.  If nrf5_init hasn't run yet the driver is uninitialized
# → hard fault in the NET cooperative thread.
#
# Fix: move nrf5_init to priority 89, one slot before the priority-90
# batch.  The ieee802154 device is fully ready before net_core_init runs.
#
# Final order:
#   89  nrf5_init (IEEE 802.15.4 driver, ready before net_core_init)
#   90  usb_device_init, net_core_init, sensor inits
#   99  nrf_802154_configurator
#
# BUILD_ASSERT in nrf_802154_configurator requires:
#   IEEE802154_NRF5_INIT_PRIO < NRF_802154_RADIO_CONFIG_PRIO (89 < 99 ✓)
CONFIG_IEEE802154_NRF5_INIT_PRIO=89
CONFIG_NRF_802154_RADIO_CONFIG_PRIO=99

# ── Watchdog — survive Adafruit bootloader WDT ───────────────
# The Adafruit UF2 bootloader starts a 1-second hardware WDT before
# jumping to the app.  nRF WDT cannot be stopped once started, so the
# app must feed it.  CONFIG_WDT_NRFX=y gives us nrfx_wdt so we can
# allocate the existing channel and keep feeding it in the app.
# wdt_feed_all() in main.c feeds all active channels via the nRF HAL.
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y

# ── RAM power-down — unused SRAM banks off during sleep ──────────────
# Powers down idle RAM banks to cut sleep current.
# NOTE: power_down_unused_ram() must be called explicitly from main.c
# before zigbee_enable().  This library does NOT auto-call it unless
# CONFIG_RAM_POWER_ADJUST_ON_HEAP_RESIZE=y, which requires newlib.
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# ── Power management ─────────────────────────────────────────────────
# CONFIG_PM=y here enables the nRF Connect Partition Manager (flash
# layout), NOT Zephyr system-level CPU sleep.  On nRF52840 / Zephyr 3.6
# there is no HAS_PM so Zephyr system PM cannot be selected; it is a
# no-op if set.
#
# Deep sleep on nRF52840 works through the idle thread (WFI) combined
# with MPSL automatically releasing the HFCLK between radio operations.
# This is hardware-managed and requires no Zephyr PM layer.
#
# CONFIG_PM_DEVICE=y enables per-driver PM callbacks (e.g. TWIM puts
# SDA/SCL into low-power pinctrl state during sleep).
# LIMITATION: PM_DEVICE suspends USB CDC even with VBUS present, breaking
# serial logging. For USB debugging: keep PM_DEVICE=n (adds ~0.5mA).
# For battery production: set PM_DEVICE=y and disable USB/logging.
CONFIG_PM=y
# CONFIG_PM_DEVICE=y

# ── Stack / heap sizes ────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ZBOSS_DEFAULT_THREAD_STACK_SIZE=4096
